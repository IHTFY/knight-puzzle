<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Guide the knight to every safe square around the queen, in order, as quickly as possible." />
    <meta name="theme-color" content="#201020" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Knight Puzzle" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.json" />

    <title>Knight Puzzle</title>
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="images/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <script src="jquery.min.js"></script>
    <script src="chessboard.js"></script>
    <script defer src="main.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="head">
        <a
          class="gh"
          href="https://github.com/IHTFY/knight-puzzle"
          aria-label="GitHub repository"
        >
          <svg id="gh_logo" height="28" width="28" viewBox="0 0 32 32" fill="white">
            <path
              d="M16 0C7.2 0 0 7.2 0 16c0 7.1 4.6 13 11 15 .8 .14 1.1-.34 1.1-.76 0-.38-.02-1.6-.02-3-4 .74-5.1-.98-5.4-1.9-.18-.46-.96-1.9-1.6-2.3-.56-.3-1.4-1-.02-1.1 1.3-.02 2.2 1.2 2.5 1.6 1.4 2.4 3.7 1.7 4.7 1.3 .14-1 .56-1.7 1-2.1-3.6-.4-7.3-1.8-7.3-7.9 0-1.7 .62-3.2 1.6-4.3-.16-.4-.72-2 .16-4.2 0 0 1.3-.42 4.4 1.6 1.3-.36 2.6-.54 4-.54 1.4 0 2.7 .18 4 .54 3.1-2.1 4.4-1.6 4.4-1.6 .88 2.2 .32 3.8 .16 4.2 1 1.1 1.6 2.5 1.6 4.3 0 6.1-3.7 7.5-7.3 7.9 .58 .5 1.1 1.5 1.1 3 0 2.1-.02 3.9-.02 4.4 0 .42 .3 .92 1.1 .76A16 16 0 0 0 32 16c0-8.8-7.2-16-16-16z"
            ></path>
          </svg>
        </a>
        <h1 class="title-text">Knight Around the Queen</h1>
      </header>

      <main class="stage">
        <div id="boardContainer">
          <div id="board"></div>
        </div>
      </main>

      <section class="controls">
        <div class="cell">
          <button class="button is-danger" id="reset">Reset</button>
          <p class="value" id="moveCount">0</p>
        </div>
        <div class="cell">
          <button class="button is-info" id="showTimer">Timer</button>
          <p class="value" id="timerDisplay">00:00:00</p>
        </div>
        <div class="cell">
          <button class="button is-info" id="showTarget">Hide Target</button>
          <p class="value" id="targetsHit">0</p>
        </div>
        <div class="cell">
          <button class="button is-info" id="queenVision">Queen Vision</button>
        </div>
        <div class="cell">
          <button class="button is-info" id="statsButton">Stats</button>
        </div>
      </section>
    </div>

    <div id="statsPanel" class="stats-overlay is-hidden">
      <div class="stats-box">
        <table class="table">
          <thead>
            <tr>
              <th>Square</th>
              <th>Best</th>
              <th>Moves</th>
              <th>Split</th>
            </tr>
          </thead>
          <tbody id="statsDisplay"></tbody>
        </table>
      </div>
    </div>
  </body>
</html>
